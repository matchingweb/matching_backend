spring:
  application:
    name: matching-backend
  datasource:
    url: jdbc:h2:mem:matching;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret: matching-backend-secret-key-for-local-development-2026
  access-token-expiration-millis: 3600000
